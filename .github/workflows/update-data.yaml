name: Update Armenia road & rail data

on:
  schedule:
    - cron: '0 3 1 * *'      # monthly, 03:00 UTC on the 1st
  workflow_dispatch:          # or run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build data
        working-directory: scripts
        run: python build_data.py

      - name: Verify output
        run: |
          test -f data/meta.json || { echo "::error::data/meta.json missing"; exit 1; }
          echo "Files produced:"
          find data -type f -name '*.geojson' -o -name 'meta.json' | sort
          echo "---"
          echo "Total size: $(du -sh data | cut -f1)"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Armenia road & rail data $(date -u +%F)"
            git push
          fi